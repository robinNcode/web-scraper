[project]
name = "paper-scraper"
version = "0.1.0"
description = "Scrape a web page and summarize it as a Criticise with refrences against it's content's hightlighted statments Markdown file."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.scripts]
paper-scraper = "paper_scraper.cli:main"

[tool.setuptools]
packages = ["paper_scraper"]
package-dir = {paper_scraper = "."}
