[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-scraper"
version = "0.1.0"
description = "Scrape web pages and summarize them as research-paper-style Markdown."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "anthropic>=0.40",
    "openai>=1.50",
    "indic-transliteration>=2.3",
]

[project.scripts]
paper-scraper = "paper_scraper.cli:main"
paper-scraper-web = "paper_scraper.web:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_scraper*"]

[tool.setuptools.package-data]
paper_scraper = ["webui/*.html", "webui/*.css", "webui/*.js"]
